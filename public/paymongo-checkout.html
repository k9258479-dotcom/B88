<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayMongo Secure Payment Gateway - Bet88</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-purple-500/40 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden p-6 sm:p-8 space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-400 font-black text-xl">
          💳
        </div>
        <div>
          <span class="text-xs uppercase font-extrabold tracking-wider text-purple-400 block">PayMongo Gateway</span>
          <h1 class="text-sm font-bold text-white">Bet88 Secure Payment</h1>
        </div>
      </div>
      <span class="px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full text-[10px] font-bold">
        SSL Encrypted
      </span>
    </div>

    <!-- Amount Card -->
    <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl text-center space-y-1">
      <span class="text-xs text-slate-400">Total Amount to Pay</span>
      <div class="text-3xl font-black text-emerald-400 font-mono" id="displayAmount">₱500.00</div>
      <span class="text-[11px] text-slate-500 block font-mono" id="displayRef">Ref: PM-12345678</span>
    </div>

    <!-- E-wallet Options -->
    <div class="space-y-3">
      <span class="text-xs text-slate-400 font-semibold block">Pumili ng Payment Channel:</span>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <label class="p-3 bg-slate-950 border-2 border-purple-500/60 rounded-xl flex items-center gap-2 cursor-pointer">
          <input type="radio" name="channel" value="GCash" checked class="text-purple-600" />
          <span class="font-bold text-blue-400">GCash</span>
        </label>
        <label class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center gap-2 cursor-pointer hover:border-slate-700">
          <input type="radio" name="channel" value="Maya" class="text-purple-600" />
          <span class="font-bold text-emerald-400">Maya</span>
        </label>
      </div>
    </div>

    <!-- Phone Confirmation -->
    <div>
      <label class="text-xs text-slate-400 block mb-1">E-Wallet Registered Mobile Number</label>
      <input type="tel" id="inputPhone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white font-mono text-xs focus:border-purple-400" required />
    </div>

    <div id="statusMessage" class="hidden p-3 rounded-xl text-xs"></div>

    <!-- Pay Button -->
    <button
      id="btnPay"
      onclick="handlePayment()"
      class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:brightness-110 active:scale-95 text-white font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg shadow-purple-600/30"
    >
      I-kumpleto ang Bayad (Authorize Payment)
    </button>

    <div class="text-center text-[10px] text-slate-500">
      Automated PayMongo Gateway settlement. Ang credits ay agad na papasok sa inyong account.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = parseFloat(params.get('amount')) || 500;
    const phone = params.get('phone') || '09060489645';
    const ref = params.get('ref') || 'PM-' + Math.floor(10000000 + Math.random() * 90000000);
    const txId = params.get('tx') || 'tx_pm_' + Date.now();

    document.getElementById('displayAmount').textContent = '₱' + amount.toLocaleString('en-US', { minimumFractionDigits: 2 });
    document.getElementById('displayRef').textContent = 'Ref: ' + ref;
    document.getElementById('inputPhone').value = phone;

    async function handlePayment() {
      const btn = document.getElementById('btnPay');
      const status = document.getElementById('statusMessage');
      btn.disabled = true;
      btn.textContent = 'Pinoproseso ang Bayad sa PayMongo...';

      // Approve in backend Express
      try {
        await fetch('/api/admin/transactions/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            transactionId: txId,
            userPhone: phone,
            amount: amount,
            type: 'DEPOSIT'
          })
        });
      } catch (e) {}

      status.className = 'p-3 rounded-xl bg-emerald-950 border border-emerald-500 text-emerald-300 text-xs block text-center font-bold';
      status.textContent = '✅ Tagumpay! Pumasok na ang bayad sa iyong Bet88 Wallet. Nag-reredirect pabalik sa laro...';

      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    }
  </script>
</body>
</html>
